name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || echo "Lint not configured"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test || echo "Tests not configured"

  rust-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: |
          cd vm-core
          cargo fmt -- --check

      - name: Run clippy
        run: |
          cd vm-core
          cargo clippy -- -D warnings || echo "Clippy warnings found"

      - name: Build Rust
        run: |
          cd vm-core
          cargo build --release

      - name: Run Rust tests
        run: |
          cd vm-core
          cargo test
